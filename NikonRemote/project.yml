name: NikonRemote
options:
  bundleIdPrefix: com.jiangcheng
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "15.0"
targets:
  NikonRemote:
    type: application
    platform: iOS
    sources:
      - path: NikonRemote
        excludes:
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangcheng.nikonremote
        INFOPLIST_FILE: NikonRemote/Info.plist
        CODE_SIGN_ENTITLEMENTS: NikonRemote/NikonRemote.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "0.1.0"
        IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    scheme:
      testTargets:
        - NikonRemoteTests
  NikonRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - NikonRemoteTests
    dependencies:
      - target: NikonRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jiangcheng.nikonremote.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
