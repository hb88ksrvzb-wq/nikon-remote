name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: NikonRemote
        run: xcodegen generate

      - name: Build unsigned app
        working-directory: NikonRemote
        run: |
          xcodebuild -project NikonRemote.xcodeproj \
            -scheme NikonRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package IPA
        working-directory: NikonRemote
        run: |
          APP="build/Build/Products/Release-iphoneos/NikonRemote.app"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r NikonRemote.ipa Payload
          ls -lh NikonRemote.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NikonRemote-ipa
          path: NikonRemote/NikonRemote.ipa
          retention-days: 30
